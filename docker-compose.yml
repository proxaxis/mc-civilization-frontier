name: mc_civilization_frontier

services:
  # Development Container
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: mc-civilization-frontier-app:latest
    container_name: mc_civilization_frontier_app
    stdin_open: true
    tty: true
    volumes:
      - ./app:/app:cached

  # Test Minecraft Fabric Server
  testserver:
    build:
      context: .
      dockerfile: Dockerfile.testserver
    image: mc-civilization-frontier-testserver:latest
    container_name: mc_civilization_frontier_testserver
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "devpassword"
      MEMORY: "6G"
      JVM_XX_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "25565:25565"
      - "25575:25575"
      - "5005:5005"
    stdin_open: true
    tty: true
    volumes:
      - nv_testserver_data:/data
      - ${WORKSPACE_HOST_PATH:-.}/resources/mods:/data/mods:ro
      - ${WORKSPACE_HOST_PATH:-.}/resources/datapacks/cfb_fixes:/data/world/datapacks/cfb_fixes:ro
      - ${WORKSPACE_HOST_PATH:-.}/resources/datapacks/cfb_skills:/data/world/datapacks/cfb_skills:ro

  # Operation Agent
  orchestrator:
    image: proxaxis/orchestrator:latest
    container_name: mc_civilization_frontier_orchestrator
    shm_size: "2gb"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/ws

volumes:
  nv_testserver_data:
